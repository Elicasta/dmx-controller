name: Build Apple Silicon DMG

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build-apple-silicon-dmg.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Apple Silicon DMG
        run: npm run tauri build -- --target aarch64-apple-darwin --bundles dmg --config '{"bundle":{"createUpdaterArtifacts":false}}'

      - name: Collect DMG
        run: |
          mkdir -p artifact
          DMG="$(find src-tauri/target/aarch64-apple-darwin/release/bundle/dmg -name '*.dmg' -type f -print -quit)"
          test -n "$DMG"
          cp "$DMG" "artifact/DMX-Controller-Apple-Silicon.dmg"

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: DMX-Controller-Apple-Silicon
          path: artifact/DMX-Controller-Apple-Silicon.dmg
          if-no-files-found: error
          retention-days: 30
