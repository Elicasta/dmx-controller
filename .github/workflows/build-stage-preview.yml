name: Publish Stage Preview

on:
  push:
    branches:
      - stage-editor-v2
    paths-ignore:
      - "docs/**"

permissions:
  contents: read

concurrency:
  group: lumarig-stage-preview
  cancel-in-progress: true

jobs:
  preview:
    name: Build signed Apple Silicon preview
    runs-on: macos-latest

    steps:
      - name: Check out stage branch
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install dependencies
        run: npm ci

      - name: Validate preview release secrets
        env:
          RELEASE_TOKEN: ${{ secrets.DMX_RELEASE_TOKEN }}
          UPDATER_PUBLIC_KEY: ${{ secrets.TAURI_SIGNING_PUBLIC_KEY }}
          UPDATER_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          UPDATER_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          test -n "$RELEASE_TOKEN" || (echo "Missing DMX_RELEASE_TOKEN" && exit 1)
          test -n "$UPDATER_PUBLIC_KEY" || (echo "Missing TAURI_SIGNING_PUBLIC_KEY" && exit 1)
          test -n "$UPDATER_PRIVATE_KEY" || (echo "Missing TAURI_SIGNING_PRIVATE_KEY" && exit 1)
          test -n "$UPDATER_PRIVATE_KEY_PASSWORD" || (echo "Missing TAURI_SIGNING_PRIVATE_KEY_PASSWORD" && exit 1)

      - name: Configure isolated preview app and updater
        env:
          PREVIEW_VERSION: 100.0.${{ github.run_number }}-stage-preview
          TAURI_SIGNING_PUBLIC_KEY: ${{ secrets.TAURI_SIGNING_PUBLIC_KEY }}
        run: |
          node <<'NODE'
          const fs = require('fs');

          const version = process.env.PREVIEW_VERSION;
          const pkgPath = 'package.json';
          const pkg = JSON.parse(fs.readFileSync(pkgPath, 'utf8'));
          pkg.version = version;
          fs.writeFileSync(pkgPath, JSON.stringify(pkg, null, 2) + '\n');

          const configPath = 'src-tauri/tauri.conf.json';
          const config = JSON.parse(fs.readFileSync(configPath, 'utf8'));
          config.productName = 'LumaRig Stage Preview';
          config.identifier = 'com.eccreative.lumarig.stagepreview';
          config.bundle.createUpdaterArtifacts = true;
          config.plugins ??= {};
          config.plugins.updater ??= {};
          config.plugins.updater.pubkey = process.env.TAURI_SIGNING_PUBLIC_KEY;
          config.plugins.updater.endpoints = [
            'https://raw.githubusercontent.com/Elicasta/dmx-controller-releases/main/latest-preview.json'
          ];
          if (config.app?.windows?.[0]) config.app.windows[0].title = 'LumaRig Stage Preview';
          fs.writeFileSync(configPath, JSON.stringify(config, null, 2) + '\n');
          NODE

      - name: Run frontend tests
        run: npm test

      - name: Build frontend
        run: npm run build

      - name: Run native tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build, sign, and publish preview
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.DMX_RELEASE_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          owner: Elicasta
          repo: dmx-controller-releases
          releaseCommitish: main
          tagName: preview-v__VERSION__
          releaseName: "LumaRig Stage Preview v__VERSION__"
          releaseBody: "Automatic preview build from stage-editor-v2. Test here before promoting changes to production LumaRig."
          releaseDraft: false
          prerelease: true
          generateReleaseNotes: false
          uploadUpdaterJson: true
          uploadUpdaterSignatures: true
          args: "--target aarch64-apple-darwin"

      - name: Publish preview updater pointer
        env:
          GH_TOKEN: ${{ secrets.DMX_RELEASE_TOKEN }}
          PREVIEW_VERSION: 100.0.${{ github.run_number }}-stage-preview
        run: |
          node <<'NODE'
          const owner = 'Elicasta';
          const repo = 'dmx-controller-releases';
          const tag = `preview-v${process.env.PREVIEW_VERSION}`;
          const token = process.env.GH_TOKEN;
          const headers = {
            Authorization: `Bearer ${token}`,
            Accept: 'application/vnd.github+json',
            'X-GitHub-Api-Version': '2022-11-28',
            'User-Agent': 'LumaRig-Preview-Publisher'
          };

          async function github(path, options = {}) {
            const response = await fetch(`https://api.github.com${path}`, {
              ...options,
              headers: { ...headers, ...(options.headers || {}) }
            });
            if (!response.ok) {
              throw new Error(`${options.method || 'GET'} ${path}: ${response.status} ${await response.text()}`);
            }
            return response;
          }

          const release = await (await github(`/repos/${owner}/${repo}/releases/tags/${encodeURIComponent(tag)}`)).json();
          const latestAsset = release.assets.find((asset) => asset.name === 'latest.json');
          if (!latestAsset) throw new Error('Preview release did not contain latest.json.');

          const latestResponse = await fetch(latestAsset.browser_download_url);
          if (!latestResponse.ok) throw new Error(`Could not download preview latest.json: ${latestResponse.status}`);
          const latest = JSON.parse(await latestResponse.text());

          const updaterBundle = release.assets.find((asset) => asset.name.endsWith('.app.tar.gz'));
          if (!updaterBundle) throw new Error('Preview release did not contain a macOS updater bundle.');
          for (const platform of Object.values(latest.platforms || {})) {
            platform.url = updaterBundle.browser_download_url;
          }
          const latestText = JSON.stringify(latest, null, 2) + '\n';

          let currentSha;
          const current = await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/latest-preview.json?ref=main`, { headers });
          if (current.ok) currentSha = (await current.json()).sha;
          else if (current.status !== 404) throw new Error(`Could not inspect current preview pointer: ${current.status} ${await current.text()}`);

          const body = {
            message: `Update Stage Preview feed to ${process.env.PREVIEW_VERSION}`,
            content: Buffer.from(latestText).toString('base64'),
            branch: 'main',
            ...(currentSha ? { sha: currentSha } : {})
          };
          await github(`/repos/${owner}/${repo}/contents/latest-preview.json`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(body)
          });

          console.log(`Preview updater feed now points to ${tag}`);
          NODE

      - name: Upload preview DMG for direct testing
        uses: actions/upload-artifact@v4
        with:
          name: LumaRig-Stage-Preview
          path: src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
          retention-days: 14
