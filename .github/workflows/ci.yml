name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: npm ci

      - name: Verify release version metadata
        run: npm run check:version

      - name: Frontend tests
        run: npm test

      - name: Frontend production build
        run: npm run build

      - name: Native tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Capture resolved Cargo lock
        uses: actions/upload-artifact@v4
        with:
          name: resolved-cargo-lock
          path: src-tauri/Cargo.lock

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - name: Prepare browser
        run: |
          if command -v google-chrome >/dev/null; then
            google-chrome --version
            echo "PLAYWRIGHT_CHANNEL=chrome" >> "$GITHUB_ENV"
          else
            npx playwright install --with-deps chromium
          fi
      - run: npm run test:ui
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: show-creator-browser-verification
          path: test-results
          if-no-files-found: ignore


  windows-smoke:
    name: Windows x64 smoke
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install frontend dependencies
        run: npm ci

      - name: Verify release version metadata
        run: npm run check:version

      - name: Frontend tests
        run: npm test

      - name: Frontend production build
        run: npm run build

      - name: Native Windows compile check
        run: cargo check --manifest-path src-tauri/Cargo.toml --target x86_64-pc-windows-msvc
