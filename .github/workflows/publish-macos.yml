name: Publish macOS Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (for example 0.4.2)"
        required: true
        type: string
      notes:
        description: "Release notes shown in GitHub and the in-app updater"
        required: false
        default: "LumaRig update"
        type: string

permissions:
  contents: read

concurrency:
  # macOS and Windows both update the same GitHub Release + latest.json.
  # Serialize a version across both workflows so updater metadata cannot race.
  group: lumarig-release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release candidate
    runs-on: macos-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: npm ci

      - name: Verify source release metadata
        run: npm run check:version

      - name: Frontend tests
        run: npm test

      - name: Frontend production build
        run: npm run build

      - name: Native tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

  publish:
    needs: validate
    name: Build ${{ matrix.label }}
    runs-on: macos-latest
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - label: Apple Silicon
            args: "--target aarch64-apple-darwin"
          - label: Intel
            args: "--target x86_64-apple-darwin"
          - label: Universal
            args: "--target universal-apple-darwin"

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Set up Rust targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: npm ci

      - name: Validate release secrets
        env:
          RELEASE_TOKEN: ${{ secrets.DMX_RELEASE_TOKEN }}
          UPDATER_PUBLIC_KEY: ${{ secrets.TAURI_SIGNING_PUBLIC_KEY }}
          UPDATER_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          UPDATER_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          test -n "$RELEASE_TOKEN" || (echo "Missing DMX_RELEASE_TOKEN" && exit 1)
          test -n "$UPDATER_PUBLIC_KEY" || (echo "Missing TAURI_SIGNING_PUBLIC_KEY" && exit 1)
          test -n "$UPDATER_PRIVATE_KEY" || (echo "Missing TAURI_SIGNING_PRIVATE_KEY" && exit 1)
          test -n "$UPDATER_PRIVATE_KEY_PASSWORD" || (echo "Missing TAURI_SIGNING_PRIVATE_KEY_PASSWORD" && exit 1)

      - name: Set release version
        run: npm run sync:release-version -- "${{ inputs.version }}"

      - name: Verify release version metadata
        run: npm run check:version

      - name: Inject updater public key
        env:
          TAURI_SIGNING_PUBLIC_KEY: ${{ secrets.TAURI_SIGNING_PUBLIC_KEY }}
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'src-tauri/tauri.conf.json';
          const config = JSON.parse(fs.readFileSync(path, 'utf8'));
          config.plugins ??= {};
          config.plugins.updater ??= {};
          config.plugins.updater.pubkey = process.env.TAURI_SIGNING_PUBLIC_KEY;
          fs.writeFileSync(path, JSON.stringify(config, null, 2) + '\n');
          NODE

      - name: Build, sign, and publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.DMX_RELEASE_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          owner: Elicasta
          repo: dmx-controller-releases
          releaseCommitish: main
          tagName: app-v__VERSION__
          releaseName: "LumaRig v__VERSION__"
          releaseBody: ${{ inputs.notes }}
          releaseDraft: false
          prerelease: false
          generateReleaseNotes: false
          uploadUpdaterJson: true
          uploadUpdaterSignatures: true
          retryAttempts: 2
          args: ${{ matrix.args }}
