name: LumaRig Compatibility Tests

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: compatibility-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  fixture-and-network-output:
    runs-on: macos-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
      - name: Install locked dependencies
        run: npm ci
      - name: Unit tests
        run: npm test
      - name: Typecheck and Vite production build
        run: npm run build
      - name: Native Rust tests, including E1.31 packets
        run: cargo test --manifest-path src-tauri/Cargo.toml
