name: Build Pro Recovery Windows

on:
  push:
    branches:
      - recovery/pro-033-show-engine
    paths:
      - '.github/workflows/build-pro-recovery-windows.yml'
      - 'src/**'
      - 'src-tauri/**'
      - 'package.json'
      - 'package-lock.json'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out Pro recovery source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Set up Rust target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install dependencies
        run: npm ci

      - name: Verify recovery tests
        run: npm test

      - name: Verify Pro shell and Show Engine markers
        shell: pwsh
        run: |
          npm run build
          $files = Get-ChildItem 'dist/assets/*.js'
          $code = ($files | ForEach-Object { Get-Content $_.FullName -Raw }) -join ""
          foreach ($marker in @('LIVE CONTROL SURFACE','MA DESK','STEP RECIPE','SELECTION GRID','ATTRIBUTE TIMING')) {
            if (-not $code.Contains($marker)) { throw "Missing required marker: $marker" }
          }

      - name: Verify relay is included in Windows frontend
        shell: pwsh
        run: |
          node -e "const fs=require('fs'); const files=fs.readdirSync('dist/assets').filter(f=>f.endsWith('.js')); const code=files.map(f=>fs.readFileSync('dist/assets/'+f,'utf8')).join(''); for(const marker of ['dmx-controller.remote-relay.v1','signInWithPassword','state.snapshot']) if(!code.includes(marker)) throw new Error('Missing Supabase relay: '+marker);"

      - name: Test native engine
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Disable update signing for recovery installer
        shell: pwsh
        run: |
          node -e "const fs=require('fs'); const path='src-tauri/tauri.conf.json'; const config=JSON.parse(fs.readFileSync(path,'utf8')); config.bundle.createUpdaterArtifacts=false; fs.writeFileSync(path,JSON.stringify(config,null,2)+'\n');"

      - name: Force fresh native asset embedding
        run: cargo clean --manifest-path src-tauri/Cargo.toml

      - name: Build Windows x64 installer
        run: npm run tauri:build -- --target x86_64-pc-windows-msvc --bundles nsis

      - name: Check installer and checksum
        shell: pwsh
        run: |
          $installer = Get-ChildItem 'src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe' | Select-Object -First 1
          if (-not $installer) { throw 'Windows installer missing' }
          Get-FileHash -Algorithm SHA256 $installer.FullName | ForEach-Object { "$($_.Hash)  $($installer.Name)" } | Out-File -Encoding ascii "$($installer.FullName).sha256"

      - name: Upload LumaRig Pro Recovery
        uses: actions/upload-artifact@v4
        with:
          name: LumaRig-Pro-Recovery-0.3.3-Windows-x64
          path: |
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.sha256
          if-no-files-found: error
